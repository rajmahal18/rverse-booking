<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pickleball">
  <defs>
    <radialGradient id="ballFill" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#eef45e"/>
      <stop offset="0.55" stop-color="#d7e45e"/>
      <stop offset="1" stop-color="#a8b433"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#132a4e" flood-opacity="0.22"/>
    </filter>
    <mask id="holes">
      <rect width="120" height="120" fill="white"/>
      <g fill="black">
        <ellipse cx="47" cy="25" rx="8" ry="5" transform="rotate(-13 47 25)"/>
        <ellipse cx="78" cy="30" rx="7" ry="5" transform="rotate(18 78 30)"/>
        <ellipse cx="90" cy="54" rx="6" ry="9" transform="rotate(-5 90 54)"/>
        <ellipse cx="72" cy="68" rx="8" ry="10" transform="rotate(16 72 68)"/>
        <ellipse cx="43" cy="68" rx="7" ry="9" transform="rotate(-14 43 68)"/>
        <ellipse cx="27" cy="48" rx="6" ry="9" transform="rotate(12 27 48)"/>
        <ellipse cx="47" cy="91" rx="9" ry="5" transform="rotate(7 47 91)"/>
        <ellipse cx="83" cy="88" rx="7" ry="4" transform="rotate(-15 83 88)"/>
      </g>
    </mask>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/>
      <stop offset="0.48" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#softShadow)">
    <circle cx="60" cy="60" r="50" fill="url(#ballFill)" mask="url(#holes)"/>
    <path d="M28 42c10-17 30-26 50-20" fill="none" stroke="url(#shine)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
